<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182438"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD66B"/>
      <stop offset="100%" stop-color="#F5B942"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F5B942" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle with stadium border -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- Cricketer silhouette -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <!-- Helmet / Head with cap visor -->
    <path d="M 100 48 C 84 48 72 60 72 76 C 72 82 74 88 78 92 C 84 98 92 101 100 101 C 108 101 116 98 122 92 C 126 88 128 82 128 76 C 128 60 116 48 100 48 Z"/>
    <!-- Helmet Visor / Grille detail -->
    <path d="M 66 73 C 66 73 82 66 100 66 C 118 66 134 73 134 73 C 137 74 139 77 137 80 C 135 83 132 84 129 83 L 123 81 C 123 87 119 92 113 95 L 115 99 C 116 101 114 103 112 103 C 110 103 109 102 108 100 L 106 96 C 104 96.5 102 96.5 100 96.5 C 98 96.5 96 96.5 94 96 L 92 100 C 91 102 90 103 88 103 C 86 103 84 101 85 99 L 87 95 C 81 92 77 87 77 81 L 71 83 C 68 84 65 83 63 80 C 61 77 63 74 66 73 Z" opacity="0.95"/>
    
    <!-- Torso / Jersey shoulders -->
    <path d="M 52 148 C 52 124 72 114 86 110 C 91 114 95 116 100 116 C 105 116 109 114 114 110 C 128 114 148 124 148 148 C 148 158 144 168 136 174 C 126 182 114 186 100 186 C 86 186 74 182 64 174 C 56 168 52 158 52 148 Z"/>
  </g>

  <!-- Accent star at collar -->
  <polygon points="100,120 102,126 108,126 103,130 105,136 100,132 95,136 97,130 92,126 98,126" fill="#101827"/>
</svg>
